<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141922" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Off My Back">
<title>Off My Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#1c2230; --muted:#5d6678; --line:#d5dae3;
  --pine:#2f5bd3; --plum:#5b4a6e; --mustard:#9a7a10; --slate:#2f6fd0;
  --pine-soft:#e3eafb; --plum-soft:#ece8f1; --mustard-soft:#f6efd6; --slate-soft:#e2ecfa;
  --on-pine:#FFFFFF; --red:#c8452f; --good:#23915a;
  --w:#c9a227; --u:#2f6fd0; --b:#5b4a6e; --r:#c8452f; --g:#2e8a52;
  --c1:#2f6fd0; --c2:#c8452f; --c3:#c9a227; --c4:#2e8a52; --c5:#5b4a6e; --c6:#d07a2a; --c7:#2f95ab; --c8:#8a93a3;
  --c9:#c2457e; --c10:#5f8f1c; --c11:#4a52c8; --c12:#8a5a3a; --c13:#9b3fb8; --c14:#1f9a8a;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141922; --surface:#1d2430; --ink:#e7ebf2; --muted:#98a2b4; --line:#2e3746;
    --pine:#7aa0ff; --plum:#a993c6; --mustard:#e0bd4a; --slate:#6fa3ff;
    --pine-soft:#222d45; --plum-soft:#2a2535; --mustard-soft:#332d18; --slate-soft:#1f2c42;
    --on-pine:#0f1522; --red:#f07a63; --good:#5ccf8f;
    --w:#e0bd4a; --u:#6fa3ff; --b:#a993c6; --r:#f07a63; --g:#5cc488;
    --c1:#6fa3ff; --c2:#f07a63; --c3:#e0bd4a; --c4:#5cc488; --c5:#a993c6; --c6:#f0a060; --c7:#6ccfe0; --c8:#a8b0bc;
  --c9:#f07ab0; --c10:#a8d65a; --c11:#9aa0ff; --c12:#c9a07a; --c13:#d38ae8; --c14:#5fd6c4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1d2430; --ink:#e7ebf2; --muted:#98a2b4; --line:#2e3746;
  --pine:#7aa0ff; --plum:#a993c6; --mustard:#e0bd4a; --slate:#6fa3ff;
  --pine-soft:#222d45; --plum-soft:#2a2535; --mustard-soft:#332d18; --slate-soft:#1f2c42;
  --on-pine:#0f1522; --red:#f07a63; --good:#5ccf8f;
  --w:#e0bd4a; --u:#6fa3ff; --b:#a993c6; --r:#f07a63; --g:#5cc488;
  --c1:#6fa3ff; --c2:#f07a63; --c3:#e0bd4a; --c4:#5cc488; --c5:#a993c6; --c6:#f0a060; --c7:#6ccfe0; --c8:#a8b0bc;
  --c9:#f07ab0; --c10:#a8d65a; --c11:#9aa0ff; --c12:#c9a07a; --c13:#d38ae8; --c14:#5fd6c4;
  color-scheme: dark;
}
.pips{display:flex;gap:6px;margin-bottom:12px}.pips span{width:12px;height:12px;border-radius:50%}
.sw-inline{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.num{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:20px 18px 120px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
header.top h1{font-size:clamp(1.8rem,6vw,2.4rem);font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.05}
#saveState{font-size:.85rem;color:var(--muted)}
h2{font-size:1.2rem;font-weight:700;margin:28px 0 10px}
h3{font-size:1.02rem;font-weight:700;margin:0}
p{margin:.3em 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
section[hidden]{display:none}

/* Hero: the debt bar */
.hero{padding:6px 0 4px}
.hero .owe{font-size:.95rem;color:var(--muted);margin:0}
.hero .total{font-size:clamp(2.6rem,11vw,3.6rem);font-weight:800;line-height:1.05;margin:2px 0 14px;letter-spacing:-.02em}
.bar{display:flex;height:58px;border-radius:10px;overflow:hidden;background:var(--line);gap:2px}
.bar span{display:block;min-width:4px}
.t-int{background:var(--plum)} .t-promo{background:var(--mustard)} .t-loan{background:var(--slate)}
.legend{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:10px;font-size:.95rem}
.legend .sw{width:12px;height:12px;border-radius:50%;flex:none}
.legend .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.progress{margin-top:16px;font-size:.98rem}
.progress strong{color:var(--pine)}

/* Progress */
.prog-head{display:flex;align-items:baseline;gap:8px}
.pct{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.4rem;line-height:1}
.pbar{position:relative;height:22px;border-radius:99px;background:var(--plum-soft);overflow:hidden;margin:12px 0 8px}
.pbar i{display:block;height:100%;background:var(--pine);border-radius:99px}
.pbar b{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.8}
.pbar.time{background:var(--slate-soft)}
.pbar.time i{background:var(--slate)}
.pkeys{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.miles{margin-top:10px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.panel.move{border-left:6px solid var(--pine)}
.panel.warn{background:var(--mustard-soft);border-color:transparent}
.panel.alert{background:var(--plum-soft);border-color:transparent}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rows li:first-child{border-top:0}
.rows .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.deadline .days{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.6rem;line-height:1}
.deadline{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.deadline:first-child{border-top:0}
.deadline .mo{font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink);vertical-align:middle}
.tag.pine{background:var(--pine-soft);color:var(--pine)}
.tag.plum{background:var(--plum-soft);color:var(--plum)}
.tag.mustard{background:var(--mustard-soft);color:var(--mustard)}
.tag.slate{background:var(--slate-soft);color:var(--slate)}

/* Buttons & forms */
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.95rem}
.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.danger{color:var(--plum);border-color:var(--plum)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
label.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--pine);margin:2px 0 0}
input[type=range]{padding:0;accent-color:var(--pine)}
.hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* Debt cards */
.debt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.debt .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.debt .bal{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums}
.debt .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.debt .note{font-size:.88rem;color:var(--muted);margin-top:8px}

/* Bills checklist */
.bill{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bill:first-child{border-top:0}
.bill .name{flex:1}
.bill .amt{font-variant-numeric:tabular-nums}
.bill.done .name{text-decoration:line-through;color:var(--muted)}
.bill .edit{border:0;background:none;color:var(--muted);padding:4px 6px;font-size:.88rem;text-decoration:underline}

/* Plan */
.big-result{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.9rem;line-height:1.1;margin:4px 0}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details ul{list-style:none;padding:0;margin:8px 0 0;font-size:.94rem}
details li{display:flex;justify-content:space-between;padding:3px 0}
.event{font-size:.9rem;margin-top:4px}
.event.paid{color:var(--pine)} .event.promo{color:var(--mustard)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav.tabs .inner{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:12px 2px 13px;font-weight:600;font-size:.9rem;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--pine);border-top-color:var(--pine)}

/* Spending */
.cat{padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .top{display:flex;justify-content:space-between;gap:10px}
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--pine);border-radius:99px}
.meter.warn i{background:var(--mustard)}
.meter.over i{background:var(--red)}
.msg-warn{color:var(--mustard);font-weight:600}
.msg-over{color:var(--red);font-weight:600}
.txlist{display:block}
button.tx{display:flex;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;color:inherit;text-align:left;font-size:1rem}
button.tx:first-child{border-top:0}
.txrow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.txrow:first-child{border-top:0}
.dayhead{font-weight:700;font-size:1rem;color:var(--ink);padding:14px 0 6px;border-top:2px solid var(--line)}
.dayhead:first-child{border-top:0;padding-top:0}
.dayhead + .txrow{border-top:0}
.txtime{color:var(--pine);font-weight:700}
.txrow button.tx{border-top:0;flex:1;min-width:0}
.txcat{width:auto;max-width:130px;padding:6px 8px;font-size:.85rem}
.tx .d{flex:1;min-width:0}
.tx .d span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .r{font-variant-numeric:tabular-nums;white-space:nowrap}
.spent{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.2rem;line-height:1.1;margin:2px 0 8px}
.preview{max-height:44dvh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin-top:12px}
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.prow:first-child{border-top:0}
.prow .d{flex:1;min-width:0}
.prow .d span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow select{width:auto;max-width:120px;padding:4px 6px;font-size:.85rem}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,18,.55)}
dialog form{padding:20px}
dialog h3{font-size:1.2rem}
.empty{text-align:center;padding:28px 12px}
@media (prefers-reduced-motion:no-preference){
  .bar span{transition:flex-grow .5s ease}
}

/* ---------- calm, interactive layer ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stats .k{display:block;font-size:.8rem;color:var(--muted)}
.stats .v{display:block;font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel.row{display:flex}
.lead{font-size:1.25rem;margin:2px 0 2px;line-height:1.25}
.perday{text-align:right;display:grid}
/* month calendar: one dot per thing happening that day */
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.calg .dow{text-align:center;font-size:.72rem;color:var(--muted);padding-bottom:2px}
.calg button{all:unset;box-sizing:border-box;cursor:pointer;border-radius:10px;min-height:44px;padding:5px 2px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s}
.calg button:hover,.calg button:focus-visible{background:var(--line)}
.calg button.sel{background:var(--pine);color:var(--on-pine)}
.calg button.today .dn{font-weight:800;color:var(--pine)}
.calg button.sel .dn{color:var(--on-pine)}
.calg button.past{opacity:.4}
.calg .dn{font-size:.85rem}
.calg .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.cdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.cdot.in{background:var(--good)}.cdot.out{background:var(--red)}.cdot.card{background:var(--slate);opacity:.6}.cdot.move{background:var(--mustard)}
.calkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
.calkey span{display:inline-flex;align-items:center;gap:5px}
.caldetail{min-height:1.5em;animation:fadein .25s}
/* the budget equation, written as a short sum */
.eqrows li{padding:6px 0}
.eqrows li.eqtot{border-top:2px solid var(--ink);font-weight:700}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.caldetail{animation:none}.calg button{transition:none}}
.perday .num{font-weight:700;font-size:1.2rem}
.folds{display:grid;gap:8px;margin-top:14px}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden}
details.fold > summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;font-weight:400;-webkit-tap-highlight-color:transparent}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.fold .ft{font-weight:700;flex:none;display:flex;align-items:center;gap:0}
.fold.debtrow .ft{flex:1 1 auto;min-width:0}
.fold .ft .sw-inline{flex:none}
.fold .ft .sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.fold .fs{color:var(--muted);font-size:.92rem;text-align:right;white-space:nowrap;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fold.debtrow .fs{flex:none}
.fold.debtrow .fs{color:var(--ink);font-weight:700;font-size:1.02rem}
.fold .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .25s ease;flex:none;margin-left:2px}
.fold[open] > summary .chev{transform:rotate(225deg) translate(-1px,-1px)}
.fold .fb{padding:2px 16px 16px}
.fold[open] .fb{animation:fbIn .28s ease both}
@keyframes fbIn{from{opacity:0;transform:translateY(-6px)}}
.fb .panel{background:none;border:0;padding:0;margin:10px 0 0;box-shadow:none}
.fb h2{font-size:1rem;margin:18px 0 6px}
details.fold.inline{background:none;border:0;border-radius:0;border-top:1px solid var(--line);margin-top:12px}
details.fold.inline > summary{padding:10px 0 2px}
details.fold.inline .fb{padding:6px 0 0}
.meter.thin{height:6px;margin:0 0 10px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:inherit;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.panel.tip{background:var(--pine-soft);border-color:transparent;display:flex;gap:12px;align-items:center;margin-top:0}
.panel.tip p{margin:0;flex:1}
.facts{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:4px}
.facts li{font-size:1rem;color:var(--muted)}
.facts strong{color:var(--ink)}
.status{display:flex;gap:12px;align-items:flex-start}
.status .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:7px;background:var(--good)}
.status.warn{background:var(--mustard-soft);border-color:transparent}.status.warn .dot{background:var(--mustard)}
.status.bad{background:color-mix(in srgb,var(--red) 14%,var(--surface));border-color:transparent}.status.bad .dot{background:var(--red)}
.status h3{margin:0 0 2px}.status p{margin:0}
.accts{padding-top:6px;padding-bottom:6px}
.acct{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.acct:last-child{border-bottom:0}
.acct .ic{width:10px;height:36px;border-radius:99px;flex:none}
.acct .ic.good{background:var(--good)}.acct .ic.bad{background:var(--red)}
.acct .nm{flex:1;min-width:0;font-weight:600}
.acct .nm .sub{display:block;font-weight:400;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .amt{font-weight:700;font-size:1.08rem;white-space:nowrap}
.acct.net{cursor:default}.acct.net .nm{font-weight:700}
.good{color:var(--good)}.bad{color:var(--red)}.warnc{color:var(--mustard)}
.rows .r.good{color:var(--good)}
.chart .zero{stroke:var(--red);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.chart .dot.bad{fill:var(--red)}
.chart .dot.pd{fill:var(--surface);stroke:var(--pine);stroke-width:2}
.chart .base{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5;opacity:.7}
.legend.two{grid-template-columns:1fr 1fr;column-gap:16px}
.dhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;margin:16px 0 8px}
.dsorts{display:flex;gap:6px;flex-wrap:wrap}
.dhead .small{margin:0}
.dsort{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.dsort button{border:0;background:none;padding:5px 10px;border-radius:8px;font:inherit;font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.dsort button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  <header class="top">
    <h1>Off My Back</h1>
    <span class="hdr"><button class="btn small" id="installBtn" data-act="install" hidden>Install app</button><span id="saveState" aria-live="polite"></span></span>
  </header>

  <section id="tab-overview"></section>
  <section id="tab-spend" hidden></section>

</main>

    <button data-tab="overview">Home</button>
    <button data-tab="spend">Spending</button>
    <button data-tab="debts">Debts</button>
    <button data-tab="budget">Budget</button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
(function(){
const fmt = new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
const fmt0 = new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = () => Math.random().toString(36).slice(2,9);
const n = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const ym = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
const ymToDate = s => { const [y,m] = s.split('-').map(Number); return new Date(y, m-1, 1); };
const addMonths = (d,k) => new Date(d.getFullYear(), d.getMonth()+k, 1);
const monthsBetween = (a,b) => (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
const mLabel = d => d.toLocaleDateString('en-CA',{month:'short',year:'numeric'});
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const isoDay = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const EMPTY = () => ({version:1, income:{perCheque:0, nextPayday:''}, bills:[], debts:[], log:[], checks:{}, extra:0, assumedPostApr:20.99, startTotal:null, startMonth:null, tx:[], rules:{}, synced:[], snapshots:{}, monthMarks:{}, savings:{goal:1000, balance:0, log:[]}, extras:[], lastCheck:null, chequing:null, incomeLog:[], lastPayAuto:null, recurring:[], goals:[]});

let state = EMPTY();
let store = null; // {save(state)}
let saveTimer = null;
let tab = 'overview';
const TABS = ['overview','spend','months','plan','budget','debts'];

/* ---------- storage ---------- */
function setSaveState(t){ $('#saveState').textContent = t; }
function save(){
  clearTimeout(saveTimer);
  setSaveState('Saving…');
  saveTimer = setTimeout(async () => {
    try { if (store) await store.save(state); setSaveState(store ? 'Saved' : 'Not saved'); }
    catch(e){ setSaveState('Couldn’t save. Try again in a moment.'); }
  }, 500);
}
function localStore(){
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ return null; }
  return {
    load(){ try { const s = localStorage.getItem('offmyback'); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
    async save(s){ try { localStorage.setItem('offmyback', JSON.stringify(s)); } catch(e){} markDirty(); }
  };
}
async function init(){
  render();
  setSaveState('Loading…');
  let loaded = null;
  try {
    if (window.claude && claude.use) {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (db && uid) {
        const ref = db.doc('data/users/' + uid + '/state');
        const snap = await ref.get();
        if (snap.exists) loaded = JSON.parse(JSON.stringify(snap.data()));
        store = { save: s => ref.set(JSON.parse(JSON.stringify(s))) };
      }
    }
  } catch(e){ /* fall back below */ }
  if (!store) {
    const ls = localStore();
    if (ls) { loaded = ls.load(); store = ls; }
  }
  if (!IN_CLAUDE && SY){ try { const r = await cloudGet(SY.code); if (r && r.at > (SY.at || 0) && (!SY.dirty || r.at > (SY.editedAt || 0))){ loaded = r.data; LSX.set('offmyback', loaded); SY.at = r.at; SY.dirty = false; saveSY(); } setSyncState('ok'); } catch(e){ setSyncState('err'); } }
  if (!IN_CLAUDE && /^#sync\//.test(location.hash)){ const c = location.hash.slice(6); history.replaceState(null, '', location.pathname); setTimeout(() => linkCode(c), 0); }
  if (loaded) state = Object.assign(EMPTY(), loaded);
  const fixChanged = applyDataFixes();
  if (state.startTotal == null && activeDebts().length) {
    state.startTotal = currentTotal(); state.startMonth = ym(new Date());
  }
  const autoChanged = applyAutopays();
  const snapChanged = ensureSnapshots();
  if ((fixChanged || autoChanged || snapChanged) && store) save();
  setSaveState(store ? 'Saved' : 'Not saved on this device');
  animateNext = true;
  render();
  if (!IN_CLAUDE){
    (SY ? syncNow() : Promise.resolve()).then(() => { if (gScript()){ syncAlerts(false); syncBills(false); } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && gScript()) setTimeout(() => syncAlerts(false), 1500); });
  }
  try {
    const perms = (window.claude && claude.use) ? await claude.use('permissions') : null;
    const st = perms ? await perms.state('mcp:Gmail').catch(() => 'unavailable') : 'unavailable';
    if (st === 'granted'){ syncAlerts(false); syncBills(false); }
  } catch(e){}
}

/* ---------- website mode: sync across devices, install, files ---------- */
// Inside Claude the page saves to Claude's own storage. On the website (GitHub Pages) it saves on the device
// and, once sync is on, to the same sync service Card Hunt uses, under a secret code only your devices know.
const IN_CLAUDE = !!(window.claude && window.claude.use);
if (!IN_CLAUDE) document.documentElement.classList.add('web');
const SYNC_API = 'https://card-hunt.areasmina.workers.dev';
const LSX = { get(k,d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let SY = IN_CLAUDE ? null : LSX.get('omb-sync', null); // {code, at (cloud version we last saw), dirty, editedAt}
let syncState = 'idle', syncT = null, syncBusy = false;
const ALPH = 'abcdefghjkmnpqrstuvwxyz23456789';
const newCode = () => [...crypto.getRandomValues(new Uint8Array(20))].map(b => ALPH[b % ALPH.length]).join('');
const cleanCode = c => String(c || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const prettyCode = c => c.match(/.{1,4}/g).join('-');
const syncLink = c => location.origin + location.pathname + '#sync/' + c;
const saveSY = () => LSX.set('omb-sync', SY);
function markDirty(){ if (!SY) return; SY.dirty = true; SY.editedAt = Date.now(); saveSY(); clearTimeout(syncT); syncT = setTimeout(syncNow, 3000); }
async function cloudGet(code){ const r = await fetch(SYNC_API + '/sync/' + code, {cache:'no-store'}); if (r.status === 404) return null; if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function cloudPut(code, data){ const at = Date.now(); const r = await fetch(SYNC_API + '/sync/' + code, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({at, data})}); if (!r.ok) throw new Error('HTTP ' + r.status); return at; }
function syncLabel(){
  if (!SY) return 'Off';
  if (syncState === 'busy') return 'Syncing…';
  if (syncState === 'err') return 'Couldn’t sync, will retry';
  return SY.at ? 'On, synced ' + new Date(SY.at).toLocaleString('en-CA', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : 'On';
}
function setSyncState(s){ syncState = s; document.querySelectorAll('.syncstatus').forEach(e => e.textContent = syncLabel()); }
function adopt(data){ state = Object.assign(EMPTY(), data); LSX.set('offmyback', state); }
// Newest change wins: pull the cloud copy if it's newer than this device's last edit, otherwise push this device's copy.
async function syncNow(){
  if (!SY) return;
  if (syncBusy){ clearTimeout(syncT); syncT = setTimeout(syncNow, 2000); return; }
  syncBusy = true; clearTimeout(syncT); setSyncState('busy');
  try {
    const remote = await cloudGet(SY.code); let changed = false;
    if (remote && remote.at > (SY.at || 0) && (!SY.dirty || remote.at > (SY.editedAt || 0))){ adopt(remote.data); SY.at = remote.at; SY.dirty = false; changed = true; }
    if (SY.dirty || !remote){ SY.dirty = false; saveSY(); try { SY.at = await cloudPut(SY.code, state); } catch(e){ SY.dirty = true; throw e; } }
    saveSY(); setSyncState('ok');
    if (changed) render();
  } catch(e){ setSyncState('err'); clearTimeout(syncT); syncT = setTimeout(syncNow, 30000); }
  finally { syncBusy = false; }
}
async function turnOnSync(){
  SY = {code:newCode(), at:0, dirty:true, editedAt:Date.now()}; saveSY(); await syncNow();
  if (syncState === 'err'){ SY = null; LSX.set('omb-sync', null); toast('Couldn’t reach the sync service. Try again'); } else toast('Sync is on');
  render();
}
async function linkCode(raw){
  const code = cleanCode(raw); if (code.length < 16){ toast('That doesn’t look like a sync code'); return; }
  setSyncState('busy');
  let remote; try { remote = await cloudGet(code); } catch(e){ setSyncState('err'); toast('Couldn’t reach the sync service. Try again'); return; }
  if (!remote){ setSyncState('idle'); toast('We couldn’t find that sync code'); return; }
  adopt(remote.data); SY = {code, at:remote.at, dirty:false, editedAt:0}; saveSY(); setSyncState('ok');
  applyAutopays(); ensureSnapshots(); animateNext = true; render(); toast('This device is synced');
}
function syncPanel(){

const activeDebts = () => state.debts.filter(d => !d.payInFull);

function paydaysIn(d){
  if (!state.income.nextPayday) return 2;
  const anchor = new Date(state.income.nextPayday + 'T12:00:00').getTime();
  const start = new Date(d.getFullYear(), d.getMonth(), 1, 12).getTime();
  const end = new Date(d.getFullYear(), d.getMonth()+1, 1, 12).getTime();
  const step = 14*864e5;
  let t = anchor + Math.floor((start - anchor)/step) * step, c = 0;
  while (t < end) { if (t >= start - 36e5) c++; t += step; }
  return c;
}
const promoActive = (d,date) => !!d.promoEnd && date < ymToDate(d.promoEnd);
function postRate(d){ return (d.postApr === '' || d.postApr == null) ? n(state.assumedPostApr) : n(d.postApr); }
function rateAt(d,date){ if (d.promoEnd) return promoActive(d,date) ? n(d.apr) : postRate(d); return n(d.apr); }
function group(d,date){ if (d.inBudget) return 2; if (promoActive(d,date)) return 1; return 0; }

    const ga = group(a,date), gb = group(b,date);
    if (ga !== gb) return ga - gb;
    if (ga === 1) return a.promoEnd.localeCompare(b.promoEnd);
    return (rateAt(b,date) - rateAt(a,date)) || (a.bal - b.bal);
  });
}

function simulate(extra){
  const start = simStart();
  const ds = activeDebts().filter(d => n(d.balance) > 0).map(d => ({...d, bal:n(d.balance), paidOff:null}));
  const bills = billsTotal();
  let totalInterest = 0, shortfall = false; const months = [];
  for (let m = 0; m < 240; m++){
    if (ds.every(d => d.bal <= 0.005)) break;
    const date = addMonths(start, m);
    const cheques = paydaysIn(date);
    const income = cheques * n(state.income.perCheque);
    let pool = income - bills + n(extra);
    ds.forEach(d => { if (d.inBudget && d.bal <= 0.005) pool += n(d.minPay); });
    const pays = {}, events = [];
    ds.forEach(d => {
      if (d.bal <= 0.005) return;
      if (d.promoEnd && ym(date) === d.promoEnd) events.push({type:'promo', name:d.name, bal:d.bal, rate:postRate(d)});
      const i = d.bal * rateAt(d,date) / 1200; d.bal += i; totalInterest += i;
    });
    ds.forEach(d => {
      if (!d.inBudget || d.bal <= 0.005) return;
      const p = Math.min(d.bal, n(d.minPay)); d.bal -= p; pays[d.id] = (pays[d.id]||0) + p;
      pool += n(d.minPay) - p;
    });
    ds.forEach(d => {
      if (d.inBudget || d.bal <= 0.005) return;
      const p = Math.max(0, Math.min(d.bal, n(d.minPay), pool)); d.bal -= p; pool -= p; pays[d.id] = (pays[d.id]||0) + p;
    });
    if (pool < 0 || (income - bills + n(extra)) < 0) shortfall = true;
    for (const d of sortTargets(ds.filter(x => x.bal > 0.005), date)){
      if (pool <= 0.005) break;
      const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; pays[d.id] = (pays[d.id]||0) + p;
    }
    ds.forEach(d => { if (d.bal <= 0.005 && !d.paidOff){ d.bal = 0; d.paidOff = date; events.push({type:'paid', name:d.name}); } });
    months.push({date, cheques, income, pays, events, left: ds.reduce((s,d) => s + d.bal, 0)});
  }
  const done = ds.every(d => d.bal <= 0.005);
  const nonLoan = ds.filter(d => !d.inBudget);
  const lastOf = list => list.length && list.every(d => d.paidOff) ? list.reduce((a,d) => d.paidOff > a ? d.paidOff : a, list[0].paidOff) : null;
  return {months, debts:ds, totalInterest, shortfall, done, cardsFree:lastOf(nonLoan), allFree:lastOf(ds)};
}

    lines.push('BEGIN:VEVENT', `UID:omb-${icsDate(e.date)}-${i}-${Date.now()}@offmyback`, 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + icsDate(e.date), 'DTEND;VALUE=DATE:' + icsDate(isoDay(next)), 'SUMMARY:' + icsText(e.title));

  lines.push('END:VCALENDAR');

}
function icsBills(){
  const t = today(), first = day => { for (let k = 0; k < 2; k++){ const m = addMonths(t, k), d = new Date(m.getFullYear(), m.getMonth(), Math.min(day, new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate())); if (d >= t) return isoDay(d); } };
  const rule = day => 'FREQ=MONTHLY;BYMONTHDAY=' + (day >= 29 ? -1 : day);  // days 29 to 31 land on the last day of short months
  const ev = [];
  state.bills.forEach(b => { if (b.payDay && n(b.amount)) ev.push({date: first(b.payDay), title: `${b.name} ${b.source === 'card' ? '(on card) ' : ''}${fmt.format(n(b.amount))}`, rrule: rule(b.payDay)}); });
  (state.recurring || []).forEach(r => { if (r.payDay && n(r.amount)) ev.push({date: first(r.payDay), title: `${r.name} (on card) ${fmt.format(n(r.amount))}`, rrule: rule(r.payDay)}); });
  state.debts.forEach(d => { if (d.payDay && n(d.balance) > 0) ev.push({date: first(d.payDay), title: `${d.name} payment due`, rrule: rule(d.payDay), note: 'Pay at least the minimum.'}); });

function spendStatus(){
  const key = ym(new Date()), mt = state.tx.filter(t => t.date.slice(0,7) === key);
  const vb = state.bills.filter(b => b.source === 'card');
  const spent = mt.filter(t => vb.some(b => b.id === t.cat)).reduce((s,t) => s + t.amount, 0), plan = vb.reduce((s,b) => s + n(b.amount), 0);
  const now = new Date(), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const newDebt = mt.filter(t => { const d = debtOf(t); return d && !d.payInFull && !d.inBudget; }).reduce((s,t) => s + t.amount, 0);

}

function homeData(){
  const debts = activeDebts().filter(d => n(d.balance) > 0);
  const total = currentTotal();
  const sim = simulate(state.extra);
  const order = sortTargets(debts.map(d => ({...d, bal:n(d.balance)})), simStart());
  const down = state.startTotal != null ? state.startTotal - total : 0;
  const paidPct = state.startTotal ? Math.min(100, Math.max(0, down / state.startTotal * 100)) : 0;
  const everydayCards = state.debts.filter(d => d.payInFull && n(d.balance) > 0);
  const everyday = everydayCards.reduce((s,d) => s + n(d.balance), 0);
  const shown = [...order, ...everydayCards].sort((a,b) => n(b.balance) - n(a.balance));
  const moInt = d => d.payInFull ? 0 : n(d.balance) * rateAt(d, new Date()) / 1200;
  const totalInt = sum(shown, moInt);
  const nowM = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const dur = m => { const y = Math.floor(m/12), r = m % 12; return [y ? y + (y === 1 ? ' year' : ' years') : '', r ? r + (r === 1 ? ' month' : ' months') : ''].filter(Boolean).join(' ') || 'This month'; };
  return {debts, total, sim, order, down, paidPct, everydayCards, everyday, shown, moInt, totalInt, nowM, dur};
}

    let bal = n(c.balance) - since, low = bal; ev.forEach(e => { if (e.cheq){ bal += e.amt; if (bal < low) low = bal; } });

        <p class="small muted">${gp >= 100 ? 'Goal reached. Enjoy it!' : `${fmt.format(n(g.goal) - n(g.balance))} to go${g.monthly ? `, about ${Math.ceil((n(g.goal) - n(g.balance)) / n(g.monthly))} months at ${fmt0.format(n(g.monthly))} a month` : ''}.`}</p>

}

/* ---------- upcoming payments ---------- */
function upcomingEvents(days){
  const t = today(), end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + days, 23, 59), tIso = isoDay(t);
  const ev = [];
  if (n(state.income.perCheque)) paydayDates(state.lastPayAuto, end).forEach(iso => { if (iso > tIso) ev.push({date:iso, label:'Paycheque', amt:n(state.income.perCheque), cheq:true}); });
  const monthly = (day, fn) => { for (let k = 0; k < 3; k++){ const m = addMonths(t, k); const dim = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(); const dd = new Date(m.getFullYear(), m.getMonth(), Math.min(day, dim)); const iso = isoDay(dd); if (iso > tIso && dd <= end) fn(iso); } };
  state.bills.forEach(b => {
    if (!n(b.amount)) return;
    const add = iso => ev.push({date:iso, label:b.name, amt:-n(b.amount), cheq:b.source !== 'card', note: b.source === 'card' ? 'on card' : 'auto'});
    if (b.payDay) monthly(b.payDay, iso => { if (!b.lastAuto || iso > b.lastAuto) add(iso); });
    else if (b.dueDate && b.dueDate > tIso && new Date(b.dueDate + 'T12:00:00') <= end && b.lastAuto !== b.dueDate) add(b.dueDate);
  });
  (state.recurring || []).forEach(r => { if (r.payDay && n(r.amount)) monthly(r.payDay, iso => { if (!r.lastAuto || iso > r.lastAuto) ev.push({date:iso, label:r.name, amt:-n(r.amount), cheq:false, note:'on card'}); }); });
  state.debts.forEach(d => {
    if (!d.payDay || n(d.balance) <= 0) return;
    const amt = d.autoFull ? n(d.balance) : Math.min(n(d.minPay), n(d.balance));
    if (!amt) return;
    monthly(d.payDay, iso => { if (!d.lastAuto || iso > d.lastAuto) ev.push({date:iso, label:d.name + (d.autoFull ? '' : (d.inBudget || (!n(d.apr) && !d.promoEnd)) ? ' payment' : ' minimum'), amt:-amt, cheq:true, note: d.autopay === false ? 'pay manually' : 'auto'}); });
  });
  return ev.sort((a,b) => a.date.localeCompare(b.date) || b.amt - a.amt);
}
function upcomingPanel(){
  if (!state.chequing) return '';
  const ev = upcomingEvents(30); if (!ev.length) return '';
  const c = state.chequing;
  let bal = n(c.balance) - sum(state.tx.filter(t => t.method === 'debit' && (!c.updated || t.date >= c.updated)), t => t.amount);
  let low = bal, lowDate = null;
  const rows = ev.map(e => {

    return `<li style="align-items:flex-start"><span><span class="small muted">${new Date(e.date + 'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</span> ${esc(e.label)}${e.note ? ` <span class="tag ${e.note === 'pay manually' ? 'mustard' : ''}">${e.note}</span>` : ''}</span>
      <span class="r"><span style="color:${e.amt > 0 ? 'var(--pine)' : 'inherit'}">${e.amt > 0 ? '+' : '−'}${fmt.format(Math.abs(e.amt))}</span>${e.cheq ? `<br><span class="small" style="color:${bal < 0 ? 'var(--red)' : 'var(--muted)'}">${fmt.format(bal)}</span>` : ''}</span></li>`;

    <ul class="rows">${rows}</ul><p class="small muted" style="margin-top:8px">The grey number under each chequing item is your projected balance.</p></div>`;

function paydayDates(fromIso, endDate){
  const out = []; if (!state.income.nextPayday) return out;
  const step = 14 * 864e5;
  let d = fromIso ? new Date(new Date(fromIso + 'T12:00:00').getTime() + step) : new Date(state.income.nextPayday + 'T12:00:00');
  for (let g = 0; g < 80 && d <= endDate; g++){ out.push(isoDay(d)); d = new Date(d.getTime() + step); }
  return out;
}
function applyAutopays(){
  let changed = false; const t = today();
  const endToday = new Date(t.getFullYear(), t.getMonth(), t.getDate(), 23, 59);
  if (n(state.income.perCheque)){
    paydayDates(state.lastPayAuto, endToday).forEach(iso => {
      const amt = n(state.income.perCheque);
      if (state.chequing && (!state.chequing.updated || state.chequing.updated < iso)) state.chequing.balance = Math.round((n(state.chequing.balance) + amt) * 100) / 100;
      state.incomeLog = (state.incomeLog || []).concat({id:id(), date:iso, amount:amt}).slice(-60);
      state.log.push({date: iso, text: 'Paycheque', amount: amt});
      state.lastPayAuto = iso; changed = true;
    });
  }
  state.debts.forEach(d => {
    if (!d.payDay || d.autopay === false || (!n(d.minPay) && !d.autoFull)) return;
    const last = d.lastAuto ? new Date(d.lastAuto + 'T12:00:00') : null;
    let cur = last ? addMonths(new Date(last.getFullYear(), last.getMonth(), 1), 1) : new Date(t.getFullYear(), t.getMonth(), 1);
    for (let guard = 0; guard < 24; guard++){
      const dim = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
      const due = new Date(cur.getFullYear(), cur.getMonth(), Math.min(d.payDay, dim));
      if (due > t || n(d.balance) <= 0) break;
      const pay = d.autoFull ? n(d.balance) + n(d.balance) * n(d.apr) / 1200 : Math.min(n(d.minPay), n(d.balance) + n(d.balance) * n(d.apr) / 1200);
      const interest = n(d.balance) * n(d.apr) / 1200;
      d.balance = Math.max(0, Math.round((n(d.balance) + interest - pay) * 100) / 100);
      const dueIso = isoDay(due);
      if (state.chequing && (!state.chequing.updated || state.chequing.updated < dueIso)) state.chequing.balance = Math.round((n(state.chequing.balance) - pay) * 100) / 100;
      state.log.push({date: dueIso, text: 'Paid ' + d.name + ' (automatic)' + (d.balance === 0 ? ' (paid off!)' : ''), amount: Math.round(pay * 100) / 100});
      state.bills.filter(b => b.debtId === d.id).forEach(b => { const mk3 = dueIso.slice(0,7); state.checks[mk3] = state.checks[mk3] || {}; state.checks[mk3][b.id] = true; });
      d.lastAuto = dueIso; changed = true;
      cur = addMonths(cur, 1);
    }
  });
  state.bills.forEach(b => {
    if (b.dueDate && b.dueDate <= isoDay(t) && b.lastAuto !== b.dueDate && n(b.amount)){
      const mk2 = b.dueDate.slice(0,7);
      if (b.source !== 'card' && state.chequing && (!state.chequing.updated || state.chequing.updated < b.dueDate)) state.chequing.balance = Math.round((n(state.chequing.balance) - n(b.amount)) * 100) / 100;
      if (b.source === 'card') chargeBillToCard(b, b.dueDate);
      state.checks[mk2] = state.checks[mk2] || {}; state.checks[mk2][b.id] = true;
      state.log.push({date: b.dueDate, text: b.name + ' (automatic)', amount: n(b.amount)});
      b.lastAuto = b.dueDate; changed = true;
    }
    if (!b.payDay || !n(b.amount)) return;
    const last = b.lastAuto ? new Date(b.lastAuto + 'T12:00:00') : null;
    let cur = last ? addMonths(new Date(last.getFullYear(), last.getMonth(), 1), 1) : new Date(t.getFullYear(), t.getMonth(), 1);
    for (let guard = 0; guard < 24; guard++){
      const dim = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
      const due = new Date(cur.getFullYear(), cur.getMonth(), Math.min(b.payDay, dim));
      if (due > t) break;
      const dueIso = isoDay(due), mk = ym(due);
      if (b.source !== 'card' && state.chequing && (!state.chequing.updated || state.chequing.updated < dueIso)) state.chequing.balance = Math.round((n(state.chequing.balance) - n(b.amount)) * 100) / 100;
      if (b.source === 'card') chargeBillToCard(b, dueIso);
      state.checks[mk] = state.checks[mk] || {}; state.checks[mk][b.id] = true;
      state.log.push({date: dueIso, text: b.name + ' (automatic)', amount: n(b.amount)});
      if (b.goalId){ const g = (state.goals || []).find(x => x.id === b.goalId); if (g) g.balance = Math.round((n(g.balance) + n(b.amount)) * 100) / 100; }
      b.lastAuto = dueIso; changed = true;
      cur = addMonths(cur, 1);
    }
  });
  (state.recurring || []).forEach(r => {
    if (!r.payDay || !n(r.amount)) return;
    const last = r.lastAuto ? new Date(r.lastAuto + 'T12:00:00') : null;
    let cur = last ? addMonths(new Date(last.getFullYear(), last.getMonth(), 1), 1) : new Date(t.getFullYear(), t.getMonth(), 1);
    for (let guard = 0; guard < 24; guard++){
      const dim = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
      const due = new Date(cur.getFullYear(), cur.getMonth(), Math.min(r.payDay, dim));
      if (due > t) break;
      const dueIso = isoDay(due);
      chargeBillToCard({id: r.cat || 'subs', cat: r.cat || 'subs', cardId: r.cardId, amount: r.amount, name: r.name}, dueIso);
      r.lastAuto = dueIso; changed = true;
      cur = addMonths(cur, 1);
    }
  });
  return changed;
}

let repMonth = null;
const sum = (arr, f) => arr.reduce((s,x) => s + f(x), 0);
function monthReport(k){
  state.snapshots = state.snapshots || {}; state.monthMarks = state.monthMarks || {};
  const tx = state.tx.filter(t => t.date.slice(0,7) === k);
  const budgetBills = state.bills.filter(b => b.source === 'card');
  const cats = budgetBills.map(b => ({name:b.name, plan:n(b.amount), spent:sum(tx.filter(t => t.cat === b.id), t => t.amount), budget:true}));
  categories().filter(c => !budgetBills.some(b => b.id === c.v)).forEach(c => {
    const sp = sum(tx.filter(t => t.cat === c.v), t => t.amount);
    if (Math.abs(sp) > 0.005){ const b = state.bills.find(x => x.id === c.v); cats.push({name:c.l, plan: b ? n(b.amount) : 0, spent:sp, budget:false}); }
  });
  const methodsAmt = {}; tx.forEach(t => { const l = methodLabel(t.method); methodsAmt[l] = (methodsAmt[l] || 0) + t.amount; });
  const byStore = {}; tx.filter(t => t.amount > 0).forEach(t => byStore[t.desc] = (byStore[t.desc] || 0) + t.amount);
  const next = ym(addMonths(ymToDate(k), 1)), now = ym(new Date());
  const cheques = paydaysIn(ymToDate(k));
  return {
    month:k, cheques, income: cheques * n(state.income.perCheque), billsTotal: billsTotal(),
    cats, methods: methodsAmt,
    newDebt: sum(tx.filter(t => { const d = debtOf(t); return d && !d.payInFull && !d.inBudget; }), t => t.amount),
    top: Object.entries(byStore).sort((a,b) => b[1] - a[1]).slice(0,5).map(([desc,amt]) => ({desc, amt})),
    payments: sum(state.log.filter(l => l.date && l.date.slice(0,7) === k && /^Paid /.test(l.text)), l => n(l.amount)),
    debtStart: state.monthMarks[k] ?? null,
    debtEnd: state.monthMarks[next] ?? (k === now ? currentTotal() : null),
    spent: sum(tx.filter(t => t.amount > 0), t => t.amount),
    planned: sum(budgetBills, b => n(b.amount)),
    txCount: tx.length,
    extras: sum((state.extras || []).filter(x => x.date.slice(0,7) === k), x => n(x.amount)),
    saved: sum(((state.savings || {}).log || []).filter(x => x.date.slice(0,7) === k), x => n(x.amount))
  };
}
function ensureSnapshots(){
  state.snapshots = state.snapshots || {}; state.monthMarks = state.monthMarks || {};
  const now = ym(new Date()); let changed = false;
  if (state.startMonth && state.startTotal != null && state.monthMarks[state.startMonth] == null){ state.monthMarks[state.startMonth] = state.startTotal; changed = true; }
  if (state.monthMarks[now] == null && activeDebts().length){ state.monthMarks[now] = Math.round(currentTotal()*100)/100; changed = true; }
  if (!state.startMonth) return changed;
  for (let d = ymToDate(state.startMonth); ym(d) < now; d = addMonths(d, 1)){
    const k = ym(d);
    if (!state.snapshots[k]){ state.snapshots[k] = monthReport(k); changed = true; }
  }
  const ks = Object.keys(state.snapshots).sort();
  if (ks.length > 36) ks.slice(0, ks.length - 36).forEach(k => delete state.snapshots[k]);
  return changed;
}
function tipsFor(r, prev, final){
  const t = [];
  if (r.txCount === 0) t.push(['', 'No purchases logged this month. Sync your phone or import from your bank so this report is complete.']);
  if (r.debtStart != null && r.debtEnd != null){
    const p = r.debtStart - r.debtEnd;
    if (p > 0.5) t.push(['good', `Debt went down ${fmt.format(p)}${final ? '' : ' so far'}.`]);
    else if (p < -0.5) t.push(['bad', `Debt went up ${fmt.format(-p)}. Look for new card charges.`]);
  }
  r.cats.filter(c => c.budget && c.plan && c.spent > c.plan + 0.005).forEach(c => t.push(['bad', `${c.name} went ${fmt.format(c.spent - c.plan)} over budget.`]));
  if (r.newDebt > 0.005) t.push(['bad', `${fmt.format(r.newDebt)} went on cards you’re paying off. Use debit or AMEX instead.`]);
  const other = r.cats.find(c => c.name === 'Other');
  if (other && other.spent > 20) t.push(['', `${fmt.format(other.spent)} is sitting in Other. Sort it with the dropdowns in Spend so you can see where it went.`]);
  if (prev){
    const diffs = r.cats.filter(c => c.budget).map(c => { const pc = (prev.cats || []).find(x => x.name === c.name); return pc ? {name:c.name, d:c.spent - pc.spent} : null; }).filter(Boolean);
    const up = diffs.slice().sort((a,b) => b.d - a.d)[0], down = diffs.slice().sort((a,b) => a.d - b.d)[0];
    const pl = ymToDate(prev.month).toLocaleDateString('en-CA', {month:'long'});
    if (up && up.d > 20) t.push(['bad', `${up.name} is up ${fmt0.format(up.d)} from ${pl}.`]);
    if (down && down.d < -20) t.push(['good', `${down.name} is down ${fmt0.format(-down.d)} from ${pl}. Nice.`]);
  }
  if (r.saved > 0.5) t.push(['good', `You saved ${fmt.format(r.saved)} to your emergency fund.`]);
  if (final){
    const used = sum(r.cats.filter(c => c.budget), c => Math.max(0, c.spent));
    if (r.txCount && r.planned - used > 5) t.push(['good', `You came in ${fmt.format(r.planned - used)} under your everyday budgets. Send that to debt.`]);
  }
  return t.slice(0, 6);
}

/* Inside Claude, Gmail is read through Claude's Gmail connection. On the website it is read through a small

const gScript = () => (state.gmailScript && state.gmailScript.url && state.gmailScript.key) ? state.gmailScript : null;
async function gmailApi(){
  const mcp = await getMcp();
  if (mcp) return {
    search: async (q, n) => { const res = await mcp.callTool('Gmail', 'search_threads', {query: q, pageSize: n}); const p = (res && res.payload) || {}; return (Array.isArray(p.threads) ? p.threads : []).flatMap(th => Array.isArray(th.messages) ? th.messages : []); },
    body: async (id, q) => { const full = await mcp.callTool('Gmail', 'get_message', {messageId: id, messageFormat: 'PLAIN_TEXT'}); const p = (full && full.payload) || {}; return (p.plaintextBody || '') + ' ' + (p.snippet || ''); }
  };
  const g = gScript(); if (!g) return null;
  const call = async params => {
    const u = new URL(g.url); u.searchParams.set('key', g.key); Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
    let r; try { r = await fetch(u.toString(), {cache:'no-store', redirect:'follow'}); } catch(e){ throw Object.assign(new Error('net'), {code:'script_net'}); }
    if (!r.ok) throw Object.assign(new Error('http'), {code:'script_http'});
    let j; try { j = await r.json(); } catch(e){ throw Object.assign(new Error('json'), {code:'script_access'}); }
    if (j.error) throw Object.assign(new Error(j.error), {code: j.error === 'key' ? 'script_key' : 'script_err'});
    return j;
  };
  return { search: async (q, n) => (await call({q, n})).messages || [], body: async (id, q) => (await call({q, id})).text || '' };
}
function gmailScriptCode(key){
  const qs = [ALERT_Q, ...BILL_EMAILS.map(b => b.query)];
  return `// Off My Back: lets your Off My Back website read your purchase and bill emails.
// It only runs the searches listed below and only answers requests that carry your secret key.
const KEY = '${key}';
const SEARCHES = ${JSON.stringify(qs)};
function doGet(e) {
  const p = (e && e.parameter) || {};
  if (p.key !== KEY) return out({error: 'key'});
  if (SEARCHES.indexOf(p.q) < 0) return out({error: 'search'});
  const threads = GmailApp.search(p.q, 0, Math.min(100, Number(p.n) || 50));
  const msgs = [];
  threads.forEach(t => t.getMessages().forEach(m => msgs.push({id: m.getId(), subject: m.getSubject(), date: m.getDate().toISOString(), msg: m})));
  if (p.id) {
    const m = msgs.filter(x => x.id === p.id)[0];
    return m ? out({text: m.msg.getPlainBody().slice(0, 20000)}) : out({error: 'id'});
  }
  return out({messages: msgs.map(x => ({id: x.id, subject: x.subject, date: x.date}))});
}
function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;
}

function guessMethod(text){
  const t = String(text || '').toLowerCase();
  if (/\b(debit|interac|chequing|checking)\b/.test(t)) return 'debit';
  const l4 = state.debts.find(d => d.last4 && new RegExp('(?:^|\\D)' + d.last4 + '(?:\\D|$)').test(t));
  if (l4) return 'debt:' + l4.id;
  if (/american express|\bamex\b/.test(t)){ const ax = state.debts.find(d => /amex|american express/i.test(d.name)); if (ax) return 'debt:' + ax.id; }
  let best = null, score = 0, tie = false;
  methods().filter(m => m.v.startsWith('debt:')).forEach(m => {
    const toks = m.l.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 2 && !['of','the','card','line','credit'].includes(w));
    const sc = toks.filter(w => new RegExp('\\b' + w + '\\b').test(t)).length;
    if (sc > score){ score = sc; best = m.v; tie = false; } else if (sc === score && sc > 0) tie = true;
  });
  return score > 0 && !tie ? best : null;
}
function parseAlert(subject){
  const text = String(subject || '').replace(/^.*?\bO(?:MB|BM)\b\s*\|?\s*/i, '').trim();
  const parts = text.split('|').map(x => x.trim()).filter(Boolean);
  let amt = null, desc = '', date = null, cardText = text;
  if (parts.length >= 2 && money(parts[0]) != null){ amt = money(parts[0]); desc = parts[1]; cardText = parts[2] || ''; if (parts[3]) date = parseDate(parts[3]); }
  else {
    const m = text.match(/\$\s?(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/) || text.match(/(\d+\.\d{2})/);
    if (m) amt = money(m[1]);
    const cibc = text.match(/(?:card|debit)[^,|]*,\s*\d{4}\s+(.+?)\s+\$\s?[\d,]+\.\d{2}/i);
    const at = cibc ? [null, cibc[1]] : text.match(/\bat\s+(.+?)(?:\s+(?:on|with|using|for|was|is|has|in)\b|[.,|]|$)/i);
    const title = parts.length >= 3 ? parts[1] : '';
    const plain = parts.slice(0, parts.length >= 3 ? -1 : undefined).filter(x => !/\$\s?\d|\d+\.\d{2}/.test(x) && x.length > 1);
    desc = at ? at[1] : (title && !/\$\s?\d|\d+\.\d{2}/.test(title) ? title : plain[0] || text.replace(/\$?\s?\d[\d,]*\.?\d*/g, '').replace(/\s+/g, ' ').trim());
  }
  return {amt, desc: (desc || 'Phone purchase').slice(0, 80), method: guessMethod(cardText), date};

function defaultMethod(){
  const cnt = {};

  const top = Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a])[0];
  if (top && methods().some(m => m.v === top)) return top;
  const ev = state.debts.find(d => d.payInFull);
  return ev ? 'debt:' + ev.id : 'debit';
}
let alertsBusy = false;
async function syncAlerts(fromClick){
  const gm = await gmailApi();
  if (!gm){ if (fromClick){ if (IN_CLAUDE) syncMsg('Phone sync needs Gmail connected in Claude.'); else gmailSetup(); } return; }
  if (alertsBusy) return; alertsBusy = true;
  if (fromClick) syncMsg('Checking Gmail…');
  try {
    const msgs = await gm.search(ALERT_Q, 50);
    const seen = new Set(state.synced || []), got = new Set();
    pending = [];
    for (const m of msgs){
      if (!m || !m.id || seen.has(m.id) || got.has(m.id)) continue;
      got.add(m.id);
      const a = parseAlert(m.subject);
      if (a.amt == null || !isFinite(a.amt) || a.amt === 0) continue;
      if (/\bpayments?\b|thank you|paiement|deposit|e-?transfer|transfer (to|from)|signed in|\bbalance (on|is|of)\b|available credit|statement (is )?(ready|available)|minimum payment|payment (is )?due/i.test(m.subject || '')){ state.synced.push(m.id); continue; }
      const isRefund = /refund|return|credit (posted|issued|to your)|reversal|merchant credit/i.test(m.subject || '');
      if (isRefund){ a.amt = -Math.abs(a.amt); a.desc = a.desc.replace(/^(a )?(refund|credit|return)( of)?\s*/i, '') || 'Refund'; }
      let date = a.date;
      if (!date && m.date){ const d = new Date(m.date); if (!isNaN(d)) date = isoDay(d); }
      let ts = null; try { ts = m.date ? Date.parse(m.date) : Number(BigInt('0x' + m.id) >> 20n); } catch(e){}
      if (!date && ts && isFinite(ts)) date = isoDay(new Date(ts));
      pending.push({msgId: m.id, ts: (ts && isFinite(ts)) ? ts : Date.now(), date: date || isoDay(today()), amt: a.amt, desc: (a.amt < 0 ? 'Refund: ' : '') + a.desc, method: a.method});
    }
    if (pending.length){
      const fallback = defaultMethod();
      pending.forEach(r => {
        state.synced.push(r.msgId);
        const meth = r.method || fallback;
        const twin = state.tx.find(x => x.src === 'phone' && Math.abs(x.amount - r.amt) < 0.01 && x.date === r.date && Math.abs((x.ts || 0) - r.ts) < 30 * 60e3);
        if (twin){ if (r.method && twin.method !== r.method && twin.guessed){ applyTx(twin, -1); twin.method = r.method; delete twin.guessed; applyTx(twin, 1); } return; }
        const near = (x, y) => Math.abs(new Date(x + 'T12:00:00') - new Date(y + 'T12:00:00')) <= 3 * 864e5;
        if (state.tx.some(x => x.method === meth && Math.abs(x.amount - r.amt) < (x.src === 'bill' ? Math.max(0.01, x.amount * 0.08) : 0.01) && near(x.date, r.date))) return;
        const t = {id:id(), src:'phone', ts:r.ts, date:r.date, amount:Math.round(r.amt*100)/100, desc:r.desc, cat:guessCat(r.desc), method:meth};
        if (!r.method) t.guessed = true;
        t.key = txKey(t.date, t.amount, t.desc);
        state.tx.push(t); applyTx(t, 1);
      });
      const added = pending.length; pending = [];
      state.synced = state.synced.slice(-600); trimTx(); save();
      syncMsg(`Added ${added} purchase${added === 1 ? '' : 's'} from your phone. Change any budget with the dropdown in Spending.`);
    } else syncMsg(fromClick ? 'No new purchases from your phone yet.' : '');
  } catch(e){
    const c = e && e.code;
    const msg = gmailError(c) || (c === 'server_not_connected' ? 'Add Gmail in claude.ai Settings → Connectors, then try again.'
      : c === 'needs_reauth' ? 'Reconnect Gmail in claude.ai Settings → Connectors, then try again.'
      : c === 'selection_required' ? 'Choose which Gmail account to use when Claude asks, then try again.'
      : (c === 'not_in_manifest' || c === 'approval_required' || c === 'consent_required') ? 'Phone sync needs your OK to read Gmail. Tap Sync phone purchases and allow it.'
      : c === 'blocked_by_policy' ? 'Your account settings don’t allow this page to read Gmail.'
      : c === 'server_unavailable' ? 'Gmail didn’t answer. Try again in a minute.'
      : 'Phone sync didn’t work this time. Try again.');
    if (fromClick) syncMsg(msg);
  } finally { alertsBusy = false; }
}

  try {
    for (const cfg of BILL_EMAILS){
      const bill = state.bills.find(b => b.id === cfg.billId); if (!bill) continue;
      const msgs = (await gm.search(cfg.query, 5)).filter(m => m && m.id);
      const fresh = msgs.filter(m => !state.billSeen.includes(m.id));
      if (!fresh.length) continue;
      const r = parseBillEmail(await gm.body(fresh[0].id, cfg.query));
      fresh.forEach(m => state.billSeen.push(m.id));
      if (r.amount != null && r.amount > 0){
        bill.amount = r.amount;
        if (r.due && (!bill.lastAuto || r.due > bill.lastAuto)) bill.dueDate = r.due;
        bill.fromEmail = true;
        updated.push(`${bill.name} ${fmt.format(r.amount)}${r.due ? ', due ' + new Date(r.due + 'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'}) : ''}`);
      }
    }
    state.billSeen = state.billSeen.slice(-200);
    if (updated.length){ logEntry('Bill from email: ' + updated.join('; ')); applyAutopays(); save(); }
    billNote = updated.length ? 'Updated from email: ' + updated.join('; ') + '.' : (fromClick ? 'No new bill emails.' : billNote);
  } catch(e){
    if (fromClick) billNote = gmailError(e && e.code) || ((e && e.code === 'server_not_connected') ? 'Add Gmail in claude.ai Settings → Connectors, then try again.' : 'Couldn’t check bill emails this time. Try again in a minute.');
  }
  render();
}

/* CSV import */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ''));
}
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function mk(y,mo,d){ if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null; return y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function parseDate(s){
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/))){ let y = +m[3]; if (y < 100) y += 2000; const a = +m[1], b = +m[2]; return a > 12 ? mk(y, b, a) : mk(y, a, b); }
  if ((m = s.match(/^(\d{1,2})[ -]([A-Za-z]{3})[A-Za-z]*\.?[ ,-]*(\d{4})/))){ const mo = MON[m[2].toLowerCase()]; return mo ? mk(+m[3], mo, +m[1]) : null; }
  if ((m = s.match(/^([A-Za-z]{3})[A-Za-z]*\.? (\d{1,2}),? (\d{4})/))){ const mo = MON[m[1].toLowerCase()]; return mo ? mk(+m[3], mo, +m[2]) : null; }
  return null;
}
function money(x){
  if (x == null) return null; let t = String(x).replace(/[$\s,]/g, ''); if (t === '') return null;
  let neg = false; if (/^\(.*\)$/.test(t)){ neg = true; t = t.slice(1,-1); }
  if (/-$/.test(t)){ neg = true; t = t.slice(0,-1); }
  if (!/^-?\d*\.?\d+$/.test(t)) return null;
  const v = parseFloat(t); return neg ? -v : v;
}
function interpret(rows){
  if (!rows.length) return [];
  let h = null; const first = rows[0];
  if (!first.some(c => parseDate(c)) && first.some(c => /date|description|amount|debit|merchant/i.test(c))){
    h = {};
    first.forEach((c,i) => { const l = c.toLowerCase();
      if (h.date == null && /date/.test(l)) h.date = i;
      else if (h.desc == null && /desc|merchant|payee|details|name|transaction/.test(l)) h.desc = i;
      else if (h.debit == null && /debit|withdraw|charge/.test(l)) h.debit = i;
      else if (h.credit == null && /credit|deposit|payment/.test(l)) h.credit = i;
      else if (h.amt == null && /amount/.test(l)) h.amt = i; });
    rows = rows.slice(1);
  }
  const out = [];
  for (const r of rows){
    let date = null, desc = '', amt = null;
    if (h){
      date = parseDate(r[h.date]); desc = h.desc != null ? r[h.desc] || '' : '';
      if (h.debit != null || h.credit != null){ const d = money(r[h.debit]), c = money(r[h.credit]);
        if (d != null && d !== 0) amt = Math.abs(d); else if (c != null && c !== 0) amt = -Math.abs(c); }
      if (amt == null && h.amt != null) amt = money(r[h.amt]);
    } else {
      const di = r.findIndex(c => parseDate(c)); if (di < 0) continue;
      date = parseDate(r[di]);
      let j = di + 1; while (j < r.length && (r[j] === '' || money(r[j]) != null || parseDate(r[j]))) j++;
      desc = r[j] || '';
      const d = money(r[j+1]), c = money(r[j+2]);
      if (d != null && d !== 0) amt = Math.abs(d); else if (c != null && c !== 0) amt = -Math.abs(c);
    }
    if (!date || amt == null || !isFinite(amt)) continue;
    out.push({date, desc: desc.replace(/\s+/g, ' ').trim() || 'Bank transaction', amt});
  }
  if (h && h.debit == null && h.credit == null && out.length && out.filter(o => o.amt < 0).length > out.length / 2) out.forEach(o => o.amt = -o.amt);
  return out;
}
function importDialog(){
  impRows = [];
  openDialog('Import from your bank', `<p class="small">On your bank’s website, download your recent transactions as a CSV file, then choose it here. CIBC, TD and AMEX files all work. Payments and deposits are left unticked.</p>
    <label for="i-acct">These transactions are from</label><select id="i-acct" name="method">${methods().filter(m => m.v !== 'cash').map(m => `<option value="${m.v}">${esc(m.l)}</option>`).join('')}</select>
    <label class="check" id="i-bal-wrap"><input type="checkbox" name="addBal" id="i-bal" checked> Add these charges to the card’s balance <span class="small muted">(untick if you already set the balance from your statement)</span></label>
    <label for="i-file">CSV file</label><input id="i-file" type="file" accept=".csv,text/csv,text/plain">
    <p class="hint" id="i-msg"></p><div id="i-prev"></div>`, 'Import', fd => {
    const method = fd.get('method'), addBal = !!fd.get('addBal');
    const picked = fd.getAll('inc').map(Number);
    picked.forEach(i => { const r = impRows[i]; if (!r) return;
      const t = {id:id(), src:'import', date:r.date, amount:Math.round(r.amt*100)/100, desc:r.desc, cat: fd.get('cat-'+i) || 'other', method, affects: addBal, key: txKey(r.date, r.amt, r.desc)};
      state.tx.push(t); applyTx(t, 1); if (t.cat !== guessCat(t.desc)) learn(t); });
    if (picked.length) logEntry('Imported ' + picked.length + ' transactions to ' + methodLabel(method));
    trimTx();
  });
  const acct = $('#i-acct');
  const syncBal = () => { $('#i-bal-wrap').hidden = !acct.value.startsWith('debt:'); if (impRows.length) showPreview(); };
  acct.addEventListener('change', syncBal); syncBal();
  $('#i-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { impRows = interpret(parseCSV(String(rd.result))); showPreview(); };
    rd.onerror = () => { $('#i-msg').textContent = 'That file couldn’t be read. Try downloading it again.'; };
    rd.readAsText(f);
  });
}
function showPreview(){
  const method = $('#i-acct').value;
  if (!impRows.length){ $('#i-msg').textContent = 'No transactions found in that file. Make sure it’s a CSV export, not a PDF statement.'; $('#i-prev').innerHTML = ''; return; }
  const near = (a,b) => Math.abs(new Date(a) - new Date(b)) <= 3*864e5;
  let ticked = 0;
  const rows = impRows.map((r,i) => {
    const key = txKey(r.date, r.amt, r.desc);
    const dup = state.tx.some(t => t.key === key || (t.method === method && Math.abs(t.amount - r.amt) < 0.005 && near(t.date, r.date)));
    const pay = r.amt < 0 || /payment|paiement|thank you|e-?transfer|transfer|payroll|deposit|direct dep/i.test(r.desc);
    const on = !dup && !pay; if (on) ticked++;
    const cat = guessCat(r.desc);
    return `<div class="prow"><input type="checkbox" name="inc" value="${i}" ${on ? 'checked' : ''} aria-label="Import ${esc(r.desc)}">
      <span class="d"><span>${esc(r.desc)}</span><span class="small muted">${r.date}${dup ? ', already added' : pay ? ', payment or deposit' : ''}</span></span>
      <span class="num">${r.amt < 0 ? '−' + fmt.format(-r.amt) : fmt.format(r.amt)}</span>
      <select name="cat-${i}" aria-label="Category">${categories().map(c => `<option value="${c.v}" ${c.v === cat ? 'selected' : ''}>${esc(c.l)}</option>`).join('')}</select></div>`;
  }).join('');
  $('#i-msg').textContent = `Found ${impRows.length} transactions. ${ticked} ticked to import. Check the categories, then tap Import.`;
  $('#i-prev').innerHTML = `<div class="preview">${rows}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab){ setTab(t.dataset.tab); return; }
  const a = t.dataset.act;
  if (a === 'add-debt') addDebt();
  if (a === 'add-bill') addBill();
  if (a === 'add-tx') addTx();
  if (a === 'import') importDialog();
  if (a === 'sync') syncAlerts(true);
  if (a === 'gs-setup'){ dlg.close(); setTimeout(gmailSetup, 50); }
  if (a === 'review') reviewDialog();
  if (a === 'sync-help') syncHelp();
  if (a === 'balance-check') balanceCheck();
  if (a === 'sv-add') savingsMove(1);
  if (a === 'sv-use') savingsMove(-1);
  if (a === 'sv-goal') savingsGoal(t.dataset.gid || null);
  if (a === 'goal-new') savingsGoal('new');
  if (a === 'goal-add') goalMove(t.dataset.gid, 1);
  if (a === 'goal-use') goalMove(t.dataset.gid, -1);
  if (a === 'sv-entry') editSaveEntry(t.dataset.gid || null, t.dataset.eid);
  if (a === 'extra') extraMoney();
  if (a === 'cheq-update') cheqUpdate();
  if (a === 'bill-sync') syncBills(true);
  if (a === 'pay-edit') editPaycheque(t.dataset.pid);
  if (a === 'export-csv') exportCSV();
  if (a === 'backup') exportBackup();
  if (a === 'restore') restoreBackup();
  if (t.dataset.tx) editTx(t.dataset.tx);
  if (a === 'go-budget') setTab('budget');
  if (a === 'pay-pick') payDebt(null);
  if (a === 'spot-ok') spotDismiss(t.dataset.k);
  if (a === 'ics-bills') icsBills();
  if (a === 'ics-move') icsMove();
  if (t.dataset.pay) payDebt(t.dataset.pay);
  if (t.dataset.transfer) transfer(t.dataset.transfer);
  if (t.dataset.editDebt) editDebt(t.dataset.editDebt);
  if ((t.dataset.dsort && t.dataset.dsort !== debtSort) || (t.dataset.dby && t.dataset.dby !== debtBy)){
    if (t.dataset.dsort) debtSort = t.dataset.dsort; else debtBy = t.dataset.dby;
    try { localStorage.setItem('omb-debt-sort', debtSort); localStorage.setItem('omb-debt-by', debtBy); } catch(err){}
    render(); const row = document.querySelector('#tab-debts .dcards');
    if (row){ row.parentElement.classList.add('resort'); setTimeout(() => row.parentElement.classList.remove('resort'), 700); }
  }
  if (t.dataset.gotoDebt){
    const f = document.querySelector(`[data-fold="debt-${t.dataset.gotoDebt}"]`);
    if (f){ f.open = true; f.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'center'}); }
  }
  if (t.dataset.editBill) editBill(t.dataset.editBill);
});
document.addEventListener('change', e => {
  const tc = e.target.dataset && e.target.dataset.txcat;
  if (tc){ const t = state.tx.find(x => x.id === tc); if (t){ t.cat = e.target.value; learn(t); save(); render(); } return; }
  const c = e.target.dataset && e.target.dataset.check; if (!c) return;
  const key = ym(new Date()); state.checks[key] = state.checks[key] || {};
  state.checks[key][c] = e.target.checked;
  const keys = Object.keys(state.checks).sort(); if (keys.length > 6) keys.slice(0, keys.length - 6).forEach(k => delete state.checks[k]);
  save(); render();
});
function setTab(t){ animateNext = true; tab = t; if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t); render(); window.scrollTo(0,0); }
const fromHash = () => { const h = location.hash.slice(1); return TABS.includes(h) ? h : null; };
window.addEventListener('hashchange', () => { const h = fromHash(); if (h){ tab = h; render(); } });
tab = fromHash() || 'overview';
init();
})();
